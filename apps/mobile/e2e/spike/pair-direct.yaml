# Phase 0 spike helper: pair the native app with a Direct-mode server so the
# native composer can be compared against the WebView composer.
appId: app.kaioken.mobile
---
- launchApp:
    appId: app.kaioken.mobile
- tapOn:
    text: "https://kaioken.example.ts.net"
- inputText: "http://localhost:26524"
- hideKeyboard
- tapOn:
    text: "Connect"
